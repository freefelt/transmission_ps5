# The tests (they start the real daemon and manager and emulate disks with tmpfs, so they need root: a GitHub runner is a disposable VM).
# On every push and pull request: the smoke suites and the page tests. "full" (all suites) runs when asked and before a release.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run all the suites (about 45 minutes) instead of the smoke ones"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full }}
  cancel-in-progress: true

jobs:
  # A branch push whose commit already carries a tag is covered by the Release workflow of that tag (the same tests, all of them, and the build), so it is skipped here.
  # Tags are pushed together with the branch, so they are already visible; a pull request, a manual run and the call from Release (a tag ref) always run.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            if git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" | awk '{print $1}' | grep -qx "$GITHUB_SHA"; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  tests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the build tools, and libc++, OpenSSL, curl and zlib for the host build of the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev cmake make patch perl curl xz-utils unzip build-essential libc++-18-dev libc++abi-18-dev libssl-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Cache the downloaded SDK and libraries
        uses: actions/cache@v6
        with:
          path: |
            .deps
            !.deps/test
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.sh', 'scripts/build-elf.sh') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build the payload (the tests use the web files and icons it generates)
        run: ./build.sh

      - name: Prepare the machine (folders, 192.0.2.2 on lo, Node modules, Chromium)
        run: sudo env "PATH=$PATH" tests/setup-env.sh --install-chrome

      - name: Build the daemon and the manager for this machine
        run: tests/build/build-test-binaries.sh

      - name: Suites
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then scope=full; else scope=smoke; fi
          sudo env "PATH=$PATH" scripts/test.sh "$scope"

      - name: Page tests
        if: ${{ !cancelled() }}
        run: |
          sudo env "PATH=$PATH" scripts/test.sh pages settings daemon-card sleep webui effects language webui-language

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            /tmp/ps5tm-test-*.txt
            /tmp/ps5tm-test-*.out
          retention-days: 14
