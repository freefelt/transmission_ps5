# A release: push a tag that is exactly the content of the VERSION file, without any prefix (for example 0.1). The workflow checks the tag, runs ALL the tests, builds the payload and
# publishes a release with the file Transmission-<version>.elf, its SHA-256 and the notes taken from CHANGELOG.md. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION and the changelog has the notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "$GITHUB_REF_NAME" = "$version" ] || { echo "the tag $GITHUB_REF_NAME does not match VERSION ($version): the tag must be exactly $version"; exit 1; }
          scripts/release-notes.sh "$version" > /dev/null

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml
    with:
      full: true

  release:
    needs: [check, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev cmake make patch perl curl xz-utils unzip build-essential

      - name: Cache the downloaded SDK and libraries
        uses: actions/cache@v4
        with:
          path: |
            .deps
            !.deps/test
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.sh', 'scripts/build-elf.sh') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build
        run: ./build.sh

      - name: Checksum and notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          (cd build && sha256sum "Transmission-$version.elf" > "Transmission-$version.elf.sha256")
          scripts/release-notes.sh "$version" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "build/Transmission-$version.elf" "build/Transmission-$version.elf.sha256" \
            --title "Transmission for PS5 $version" --notes-file release-notes.md --verify-tag
